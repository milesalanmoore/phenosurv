name: Tests

# Run on every push to any branch, and on pull requests into main.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the pixi environment
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          # Fail if pixi.lock is out of date with pyproject.toml, so CI tests
          # exactly the environment contributors get from `pixi install`.
          locked: true
          cache: true

      - name: Unit tests
        run: pixi run test
