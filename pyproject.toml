[project]
name = "phenosurv"
version = "0.1.0"
description = "Python interface to the phenostan phenological models."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Miles Moore", email = "milesalanmoore@gmail.com" }]
dependencies = ["cmdstanpy>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phenosurv"]

# --- Development environment (pixi) -------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

# conda-forge packages: CmdStan ships here with its C++ toolchain.
[tool.pixi.dependencies]
python = ">=3.11"
cmdstanpy = ">=1.2"
cmdstan = "*"

# Install phenosurv itself in editable mode so `import phenosurv` uses src/.
[tool.pixi.pypi-dependencies]
phenosurv = { path = ".", editable = true }

[tool.pixi.tasks]
test = "python -m unittest discover -s tests -t . -v"
sync-models = "python scripts/sync_models.py"
